<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有岁 UNO</title>
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>

<!-- 首页：创建/加入房间 -->
<div id="screen-home" class="screen active">
  <div class="panel">
    <h1>有岁 UNO</h1>
    <input id="input-name" type="text" placeholder="输入你的名字" maxlength="10">
    <div class="row">
      <select id="input-maxplayers" class="select">
        <option value="2">2人局</option>
        <option value="3">3人局</option>
        <option value="4" selected>4人局</option>
        <option value="5">5人局</option>
        <option value="6">6人局</option>
        <option value="7">7人局</option>
        <option value="8">8人局</option>
      </select>
    </div>
    <div class="row">
      <button id="btn-create" class="btn primary">创建房间</button>
    </div>
    <div class="divider"><span>或</span></div>
    <div class="row">
      <input id="input-code" type="text" placeholder="房间码" maxlength="4" style="text-transform:uppercase">
      <button id="btn-join" class="btn">加入房间</button>
    </div>
    <div id="home-error" class="error"></div>
  </div>
</div>

<!-- 房间等待页 -->
<div id="screen-lobby" class="screen">
  <div class="panel">
    <h2>房间 <span id="lobby-code" class="code"></span></h2>
    <p class="hint">把房间码发给朋友，让他们加入</p>
    <div id="lobby-mode" class="lobby-mode">
      <span class="lobby-mode-label">模式</span>
      <span id="lobby-mode-name" class="lobby-mode-value">未选择</span>
      <button id="btn-change-mode" class="mini-btn change hidden">更换</button>
    </div>
    <div id="lobby-players" class="player-list"></div>
    <div id="lobby-spectators" class="player-list"></div>
    <div class="row">
      <button id="btn-addai" class="btn">+ 加 AI</button>
      <button id="btn-start" class="btn primary">开始游戏</button>
    </div>
    <button id="btn-leave" class="btn ghost">离开房间</button>
  </div>
</div>

<!-- 游戏页 -->
<div id="screen-game" class="screen">
  <div id="game-board">
    <!-- 左上角房间码 -->
    <div id="game-room-code">房间号：<span id="game-code">----</span></div>
    <div id="game-mode-chip" class="game-mode-chip hidden"></div>

    <!-- 左侧观战席 -->
    <div id="game-spectators">
      <div class="section-title">观战席</div>
      <div id="game-spectator-list"></div>
    </div>

    <!-- 对手信息 -->
    <div id="opponents"></div>

    <!-- 顶牌区 -->
    <div id="center-area">
      <div id="top-card" class="card"><span id="top-label">?</span></div>
      <div id="draw-pile" class="card back" title="摸牌"><span id="draw-count">0</span></div>
    </div>

    <!-- 抢先手按钮 -->
    <button id="btn-grab" class="btn-grab hidden">抢先手！</button>

    <div id="status-bar">
      <span id="status-text">准备中...</span>
    </div>

    <!-- 右上角菜单 -->
    <button id="btn-menu" class="btn-menu">☰</button>
    <div id="menu-dropdown" class="menu-dropdown hidden">
      <div class="menu-item">
        <span>显示手牌数量</span>
        <label class="switch">
          <input type="checkbox" id="toggle-hand-count">
          <span class="slider"></span>
        </label>
      </div>
      <button id="btn-restart">重开游戏</button>
      <button id="btn-pause">暂停游戏</button>
      <button id="btn-endgame">结束游戏</button>
      <button id="btn-leave-room">退出房间</button>
    </div>

    <!-- 暂停遮罩 -->
    <div id="pause-overlay" class="pause-overlay hidden">
      <div class="pause-text">游戏暂停</div>
      <div id="pause-by" class="pause-by"></div>
      <button id="btn-resume" class="pause-resume hidden">取消暂停</button>
    </div>

    <!-- 确认弹窗 -->
    <div id="confirm-modal" class="modal hidden">
      <div class="modal-content">
        <p id="confirm-text">确定吗？</p>
        <div class="row">
          <button id="confirm-yes" class="btn primary">确定</button>
          <button id="confirm-no" class="btn">取消</button>
        </div>
      </div>
    </div>

    <!-- 日志 -->
    <div id="game-log"></div>

    <!-- 底部操作按钮（统一样式，避免各自绝对定位重叠） -->
    <div id="action-bar">
      <button id="btn-uno" class="btn-uno hidden">喊"有岁"</button>
      <button id="btn-grab-card" class="btn-grab-card hidden">⚡ 抢相同的牌</button>
      <button id="btn-pass" class="btn-pass hidden">不出(摸1张)</button>
      <button id="btn-skip" class="btn-skip hidden">跳过回合</button>
    </div>

    <!-- 我的名次 -->
    <div id="my-rank" class="my-rank hidden"></div>

    <!-- 手牌 -->
    <div id="hand-area"></div>

    <!-- 颜色选择弹窗 -->
    <div id="color-modal" class="modal hidden">
      <div class="modal-content">
        <h3>选择颜色</h3>
        <div class="color-buttons">
          <button data-color="red" class="color-btn red">红</button>
          <button data-color="yellow" class="color-btn yellow">黄</button>
          <button data-color="green" class="color-btn green">绿</button>
          <button data-color="blue" class="color-btn blue">蓝</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 模式选择：大卡片横滑，点击确认 -->
<div id="mode-picker" class="mode-picker hidden">
  <div class="mode-picker-title">选择游戏模式</div>
  <div class="mode-picker-hint">左右滑动查看，点击卡片确认</div>
  <div class="mode-track">
    <button class="mode-card normal" data-mode="normal">
      <span class="mode-card-tag">经典</span>
      <span class="mode-card-name">正常版 UNO</span>
      <span class="mode-card-desc">官方规则<br>每人 7 张牌，按顺序出牌<br>先出完手牌者获胜</span>
    </button>
    <button class="mode-card yousui" data-mode="yousui">
      <span class="mode-card-tag">特色</span>
      <span class="mode-card-name">有岁 UNO</span>
      <span class="mode-card-desc">抢先手 · 抢相同的牌<br>可抢走别人即将打出的同牌<br>互动更多、节奏更快</span>
    </button>
  </div>
  <button id="btn-mode-cancel" class="btn ghost mode-cancel">取消</button>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="game.js?v=38"></script>
</body>
</html>
