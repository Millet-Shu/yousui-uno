<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有岁 UNO</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<!-- 首页：创建/加入房间 -->
<div id="screen-home" class="screen active">
  <div class="panel">
    <h1>有岁 UNO</h1>
    <input id="input-name" type="text" placeholder="输入你的名字" maxlength="10">
    <div class="row">
      <select id="input-maxplayers" class="select">
        <option value="2">2人局</option>
        <option value="3">3人局</option>
        <option value="4" selected>4人局</option>
        <option value="5">5人局</option>
        <option value="6">6人局</option>
        <option value="7">7人局</option>
        <option value="8">8人局</option>
      </select>
    </div>
    <div class="row">
      <button id="btn-create" class="btn primary">创建房间</button>
    </div>
    <div class="divider"><span>或</span></div>
    <div class="row">
      <input id="input-code" type="text" placeholder="房间码" maxlength="4" style="text-transform:uppercase">
      <button id="btn-join" class="btn">加入房间</button>
    </div>
    <div id="home-error" class="error"></div>
  </div>
</div>

<!-- 房间等待页 -->
<div id="screen-lobby" class="screen">
  <div class="panel">
    <h2>房间 <span id="lobby-code" class="code"></span></h2>
    <p class="hint">把房间码发给朋友，让他们加入</p>
    <div id="lobby-players" class="player-list"></div>
    <div class="row">
      <button id="btn-addai" class="btn">+ 加 AI</button>
      <button id="btn-start" class="btn primary">开始游戏</button>
    </div>
    <button id="btn-leave" class="btn ghost">离开房间</button>
  </div>
</div>

<!-- 游戏页 -->
<div id="screen-game" class="screen">
  <div id="game-board">
    <!-- 对手信息 -->
    <div id="opponents"></div>

    <!-- 顶牌区 -->
    <div id="center-area">
      <div id="top-card" class="card"><span id="top-label">?</span></div>
      <div id="draw-pile" class="card back" title="摸牌"><span id="draw-count">0</span></div>
    </div>

    <!-- 抢先手按钮 -->
    <button id="btn-grab" class="btn-grab hidden">抢先手！</button>

    <div id="status-bar">
      <span id="status-text">准备中...</span>
      <button id="btn-menu" class="btn-menu">☰</button>
      <div id="menu-dropdown" class="menu-dropdown hidden">
        <button id="btn-restart">重开游戏</button>
        <button id="btn-endgame">结束游戏</button>
      </div>
    </div>

    <!-- 日志 -->
    <div id="game-log"></div>

    <!-- 有岁按钮（手牌上方） -->
    <button id="btn-uno" class="btn-uno hidden">喊"有岁"</button>

    <!-- 手牌 -->
    <div id="hand-area"></div>

    <!-- 颜色选择弹窗 -->
    <div id="color-modal" class="modal hidden">
      <div class="modal-content">
        <h3>选择颜色</h3>
        <div class="color-buttons">
          <button data-color="red" class="color-btn" style="background:#e04040">红</button>
          <button data-color="yellow" class="color-btn" style="background:#e8d020">黄</button>
          <button data-color="green" class="color-btn" style="background:#30b050">绿</button>
          <button data-color="blue" class="color-btn" style="background:#3070d0">蓝</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="game.js?v=3"></script>
</body>
</html>
